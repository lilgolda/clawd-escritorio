name: Algo no funciona
description: Cuéntanos qué le pasa a Clawd
labels: ["error"]
body:
  - type: textarea
    id: que_paso
    attributes:
      label: ¿Qué pasó?
      description: Cuéntalo como se lo contarías a un amigo.
      placeholder: Cuando lo cuelgo del ratón y lo suelto, se queda flotando en el aire.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: ¿Cómo lo hago pasar?
      placeholder: |
        1. Clic derecho → Travesuras → Cuélgate del ratón
        2. Muevo el ratón rápido
        3. ...
  - type: dropdown
    id: como_lo_usas
    attributes:
      label: ¿Cómo lo usas?
      options:
        - Clawd.exe
        - Desde el código (pyw clawd_escritorio.py)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Capturas o errores
      description: Si lo usas desde el código con `py clawd_escritorio.py`, pega aquí lo que salga en la consola.
